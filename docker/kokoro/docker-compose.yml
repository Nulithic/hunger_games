# Local Kokoro TTS for Windows/Docker Desktop (CPU).
# Usage from repo root:
#   docker compose -f docker/kokoro/docker-compose.yml up -d
# Health:
#   curl http://127.0.0.1:8880/health

services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.4
    container_name: hunger-games-kokoro
    restart: unless-stopped
    ports:
      - '127.0.0.1:8880:8880'
    environment:
      - ONNX_NUM_THREADS=4
      - ONNX_INTER_OP_THREADS=2
    volumes:
      - kokoro-models:/app/api/src/models
      - kokoro-voices:/app/api/src/voices
      - kokoro-temp:/tmp/kokoro
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8880/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  kokoro-models:
  kokoro-voices:
  kokoro-temp:
